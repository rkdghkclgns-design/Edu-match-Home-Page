<!doctype html>
<html lang="ko">
  <head>
    <link rel="icon" type="image/png" href="./assets/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/logo.png" />
    <link rel="shortcut icon" href="./assets/logo.png" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>내 교육 — Edu-match</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: {
        brand:{50:"#eef2ff",100:"#e0e7ff",500:"#6366f1",600:"#4f46e5",700:"#4338ca"},
        accent:{500:"#06b6d4"},
      } } } };
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>body{font-family:Pretendard,system-ui,sans-serif}</style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-client.js" defer></script>
  </head>
  <body class="bg-slate-50 text-slate-900">

    <header class="sticky top-0 z-30 bg-white border-b border-slate-100">
      <div class="max-w-6xl mx-auto flex items-center justify-between px-5 h-16">
        <a href="./index.html" class="flex items-center gap-2.5">
          <img src="./assets/logo.png" alt="Edu-match" class="h-8 w-8 object-contain" />
          <span class="text-xl font-extrabold tracking-tight text-brand-600">Edu-match</span>
          <span class="text-xs font-medium text-slate-400 hidden sm:inline">내 교육</span>
        </a>
        <nav class="hidden md:flex items-center gap-5 text-sm text-slate-600">
          <a href="./index.html#jobs" class="hover:text-slate-900">공고</a>
          <a href="./consult.html" class="hover:text-slate-900">컨설팅 요청</a>
          <a href="./board.html" class="hover:text-slate-900">자유 게시판</a>
          <a href="./materials.html" class="hover:text-slate-900">자료실</a>
          <a href="./profile.html" class="hover:text-slate-900">프로필</a>
        </nav>
      </div>
    </header>

    <!-- Auth gate -->
    <div id="gate" class="hidden max-w-md mx-auto mt-20 bg-white rounded-2xl border border-slate-200 shadow-sm p-8 text-center">
      <div class="text-4xl">🔒</div>
      <h2 class="mt-3 text-xl font-bold">로그인이 필요합니다</h2>
      <p class="mt-1 text-sm text-slate-500">내 교육 페이지는 로그인 후 이용 가능합니다.</p>
      <div class="mt-6 flex gap-2 justify-center">
        <a href="./login.html" class="px-5 py-2.5 bg-brand-600 text-white font-semibold rounded-lg hover:bg-brand-700">로그인</a>
        <a href="./signup.html" class="px-5 py-2.5 bg-slate-100 text-slate-700 font-semibold rounded-lg hover:bg-slate-200">회원가입</a>
      </div>
    </div>

    <main id="content" class="hidden max-w-6xl mx-auto px-5 py-10">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <span class="text-xs font-bold tracking-widest text-brand-600 uppercase">My Activity</span>
          <h1 class="mt-1 text-2xl font-extrabold" id="me-greeting">내 교육</h1>
          <p class="text-sm text-slate-500" id="me-subline">—</p>
        </div>
      </div>

      <!-- KPI cards -->
      <div class="mt-6 grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="bg-white rounded-2xl border border-slate-100 p-4 shadow-sm">
          <div class="text-xs text-slate-500">지원한 공고</div>
          <div class="mt-1 text-2xl font-extrabold" id="kpi-apps">—</div>
        </div>
        <div class="bg-white rounded-2xl border border-slate-100 p-4 shadow-sm">
          <div class="text-xs text-slate-500">북마크</div>
          <div class="mt-1 text-2xl font-extrabold text-red-500" id="kpi-bookmarks">—</div>
        </div>
        <div class="bg-white rounded-2xl border border-slate-100 p-4 shadow-sm">
          <div class="text-xs text-slate-500">제출한 컨설팅 제안</div>
          <div class="mt-1 text-2xl font-extrabold text-brand-600" id="kpi-quotes">—</div>
        </div>
        <div class="bg-white rounded-2xl border border-slate-100 p-4 shadow-sm">
          <div class="text-xs text-slate-500">등록한 공고/요청</div>
          <div class="mt-1 text-2xl font-extrabold text-emerald-600" id="kpi-posted">—</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="mt-8 flex gap-2 border-b border-slate-200 overflow-x-auto">
        <button data-tab="apps" class="my-tab-btn px-4 py-2 text-sm font-semibold border-b-2 border-brand-600 text-brand-700">지원한 공고</button>
        <button data-tab="bookmarks" class="my-tab-btn px-4 py-2 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-900">♥ 북마크</button>
        <button data-tab="quotes" class="my-tab-btn px-4 py-2 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-900">제출한 컨설팅 제안</button>
        <button data-tab="posted" class="my-tab-btn px-4 py-2 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-900">내가 등록한 공고/요청</button>
      </div>

      <div class="mt-4">
        <div data-panel="apps" class="my-panel"></div>
        <div data-panel="bookmarks" class="my-panel hidden"></div>
        <div data-panel="quotes" class="my-panel hidden"></div>
        <div data-panel="posted" class="my-panel hidden"></div>
      </div>
    </main>

    <footer class="max-w-6xl mx-auto px-5 py-10 text-center text-sm text-slate-500">© <span id="year">2026</span> Edu-match Platform</footer>
    <script>document.getElementById("year").textContent = String(new Date().getFullYear());</script>
    <script src="./my.js" defer></script>
  </body>
</html>
